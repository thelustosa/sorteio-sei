# SINCRONIZAR JULGADOS CJ
#
# Este é o "endpoint" da sincronização. O site é estático (GitHub Pages) e não
# tem servidor: o navegador nem conseguiria consultar goias.gov.br, que não
# libera CORS. Então quem executa é o GitHub Actions — de graça, com log de
# cada rodada guardado na aba Actions, o que casa com a proposta de auditoria
# do projeto.
#
# Roda sozinho toda sexta de manhã (as sessões da Câmara são às quintas) e
# pode ser disparado à mão em Actions → Sincronizar Julgados CJ → Run workflow,
# onde dá para marcar "simular" para ver o resultado sem gravar nada.
#
# Antes do primeiro uso, cadastre em Settings → Secrets and variables →
# Actions o segredo SUPABASE_DB_URL com a connection string do banco
# (Project Settings → Database → Connection string → URI).

name: Sincronizar Julgados CJ

on:
  schedule:
    - cron: '0 12 * * 5'   # sexta, 09:00 em Goiás (12:00 UTC)
  workflow_dispatch:
    inputs:
      simular:
        description: 'Simular (não grava nada no banco)'
        type: boolean
        default: false
      ano:
        description: 'Limitar a um ano (vazio = do marco ao ano corrente)'
        type: string
        default: ''
      desde:
        description: 'Reprocessar sessões depois desta data (AAAA-MM-DD)'
        type: string
        default: ''

concurrency:
  group: sincronizar-julgados-cj   # duas rodadas ao mesmo tempo não ajudam
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sincronizacao/requirements.txt

      - run: python -m pip install -r sincronizacao/requirements.txt

      # Os parâmetros entram por variável de ambiente, nunca interpolados no
      # texto do comando: o que vem do formulário é dado, não shell.
      - name: Sincronizar
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SIMULAR: ${{ inputs.simular }}
          ANO: ${{ inputs.ano }}
          DESDE: ${{ inputs.desde }}
        run: |
          args=()
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          if [ -n "$ANO" ];   then args+=(--ano "$ANO"); fi
          if [ -n "$DESDE" ]; then args+=(--desde "$DESDE"); fi
          python sincronizacao/sincronizar.py "${args[@]}" | tee resumo.json

      - name: Resumo
        if: always()
        shell: bash
        run: |
          [ -s resumo.json ] || exit 0
          {
            echo '### Sincronização de Julgados CJ'
            echo '```json'
            cat resumo.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
