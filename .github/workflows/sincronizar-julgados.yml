# SINCRONIZAR JULGADOS
#
# Este é o "endpoint" da sincronização. O site é estático (GitHub Pages) e não
# tem servidor: o navegador nem conseguiria consultar goias.gov.br, que não
# libera CORS. Então quem executa é o GitHub Actions — de graça, com log de
# cada rodada guardado na aba Actions, o que casa com a proposta de auditoria
# do projeto.
#
# Roda os DOIS colegiados na mesma passagem, um de cada vez. A Câmara de
# Julgamento reúne às quintas e o Conselho Regulador não tem dia fixo (em 2026
# houve sessão em quarta, quinta e sexta), e nenhum dos dois anuncia a hora em
# que a pauta vai ao ar — por isso a busca é de hora em hora durante o
# expediente, e não uma rodada semanal: uma pauta publicada na terça à tarde
# entrava no site só na sexta seguinte. Cada colegiado tem a sua página na AGR
# e o seu par de tabelas — ver COLEGIADOS em sincronizacao/sincronizar.py.
#
# Repetir a busca é barato e não duplica nada: a rodada que não acha pauta nova
# é uma consulta à listagem de cada colegiado, e o que já foi sincronizado fica
# de fora pela URL registrada em pautas_* (ver pautas_pendentes) — quem chega ao
# banco ainda esbarra na chave da sessão.
#
# Pode ser disparado à mão em Actions → Sincronizar Julgados → Run workflow,
# onde dá para marcar "simular" para ver o resultado sem gravar nada e limitar
# a um colegiado.
#
# Antes do primeiro uso, cadastre em Settings → Secrets and variables →
# Actions o segredo SUPABASE_DB_URL com a connection string do banco
# (Project Settings → Database → Connection string → URI).

name: Sincronizar Julgados

on:
  schedule:
    # De hora em hora, das 07:00 às 20:00 em Goiás (UTC−3, sem horário de
    # verão), todos os dias. A janela cobre o expediente da AGR com folga dos
    # dois lados; o que sair fora dela espera a primeira rodada da manhã. O
    # GitHub atrasa agendamentos em horário de pico e não garante o minuto
    # exato — por isso a janela, e não um horário só.
    - cron: '0 10-23 * * *'
  workflow_dispatch:
    inputs:
      colegiado:
        # 'ambos' em vez de uma opção vazia: o GitHub valida a lista de um
        # choice ao carregar o arquivo, e uma entrada em branco arriscaria
        # invalidar o workflow inteiro — que então some da aba Actions sem erro
        # visível, levando o agendamento junto.
        description: 'Qual colegiado sincronizar'
        type: choice
        options: ['ambos', 'CJ', 'CREG']
        default: 'ambos'
      simular:
        description: 'Simular (não grava nada no banco)'
        type: boolean
        default: false
      ano:
        description: 'Limitar a um ano (vazio = do marco ao ano corrente)'
        type: string
        default: ''
      desde:
        description: 'Reprocessar sessões depois desta data (AAAA-MM-DD)'
        type: string
        default: ''

concurrency:
  group: sincronizar-julgados   # duas rodadas ao mesmo tempo não ajudam
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sincronizacao/requirements.txt

      - run: python -m pip install -r sincronizacao/requirements.txt

      # Os parâmetros entram por variável de ambiente, nunca interpolados no
      # texto do comando: o que vem do formulário é dado, não shell.
      #
      # Um colegiado que falhe não impede o outro de rodar — são bancos
      # separados e fontes separadas —, mas o job termina vermelho se qualquer
      # um falhar.
      - name: Sincronizar
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COLEGIADO: ${{ inputs.colegiado }}
          SIMULAR: ${{ inputs.simular }}
          ANO: ${{ inputs.ano }}
          DESDE: ${{ inputs.desde }}
        run: |
          args=()
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          if [ -n "$ANO" ];   then args+=(--ano "$ANO"); fi
          if [ -n "$DESDE" ]; then args+=(--desde "$DESDE"); fi

          case "${COLEGIADO:-ambos}" in
            CJ|CREG) alvos="$COLEGIADO" ;;
            *)       alvos='CJ CREG' ;;
          esac

          falhou=0
          for colegiado in $alvos; do
            echo "::group::$colegiado"
            estado=0
            # `shell: bash` roda com `-eo pipefail`, então o `tee` no fim do
            # cano não engole o código de saída do Python — sem pipefail, todo
            # colegiado terminaria verde, porque quem falha aqui é o script.
            python sincronizacao/sincronizar.py --colegiado "$colegiado" \
              "${args[@]}" | tee "resumo-$colegiado.json" || estado=1
            echo '::endgroup::'

            # A anotação fica FORA do grupo: dentro, ela nasceria dobrada junto
            # com o log e o motivo do vermelho só apareceria depois de expandir.
            # Nomear o colegiado é o que separa "a Action falhou" de "a CREG
            # falhou e a CJ sincronizou" quando a rodada leva os dois.
            if [ "$estado" -ne 0 ]; then
              falhou=1
              echo "::error title=Sincronização $colegiado::Falhou — abra o grupo \"$colegiado\" no log e o resumo do job."
            fi
            echo "$colegiado=$estado" >> estados.txt
          done
          exit "$falhou"

      - name: Resumo
        if: always()
        shell: bash
        run: |
          # O resumo sai de estados.txt, e não dos resumo-*.json: colegiado que
          # falhou antes de imprimir o JSON não tem arquivo, e é justamente o
          # que precisa aparecer aqui.
          [ -s estados.txt ] || exit 0

          while IFS='=' read -r colegiado estado; do
            if [ "$estado" = 0 ]; then marca='✅'; else marca='❌ falhou'; fi
            {
              echo "### Sincronização — $colegiado $marca"
              if [ -s "resumo-$colegiado.json" ]; then
                echo '```json'
                cat "resumo-$colegiado.json"
                echo '```'
              else
                echo '_Sem resumo: a execução terminou antes de produzir o JSON._'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done < estados.txt
