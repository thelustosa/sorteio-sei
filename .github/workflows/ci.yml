name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            sincronizacao/requirements.txt
            tests/requirements.txt

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Instalar dependências
        run: python -m pip install -r tests/requirements.txt

      - name: Validar JavaScript
        shell: bash
        run: |
          for arquivo in assets/js/*.js tools/*.mjs tests/*.mjs; do
            node --check "$arquivo"
          done
          for teste in tests/test_*.mjs; do
            node "$teste"
          done

      - name: Testar banco e sincronização
        shell: bash
        run: |
          for teste in tests/test_*.py; do
            python "$teste"
          done

      - name: Conferir versão e arquivos minificados
        shell: bash
        run: |
          node tools/versionar.mjs
          npx --yes esbuild@0.28.2 assets/css/index.css --minify --outfile=assets/css/index.min.css
          for arquivo in supabase bootstrap index julgados julgados-creg acervo; do
            npx --yes esbuild@0.28.2 "assets/js/$arquivo.js" --minify-syntax --minify-whitespace --outfile="assets/js/$arquivo.min.js"
          done
          git diff --exit-code -- assets/css/index.min.css assets/js/*.min.js assets/js/supabase.js ./*.html
